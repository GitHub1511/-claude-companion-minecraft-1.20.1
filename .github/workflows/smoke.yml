name: In-game smoke test

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: alone
            mods: fabric-api
          - label: shiv-modlist
            mods: fabric-api,sodium,indium,iris,lithium,modmenu,yacl,ferrite-core,controlify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -q
      - name: Install headless display + launcher
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils libopenal1 espeak > /dev/null
          pip install -q portablemc==4.4.1
      - name: Run Minecraft with the mod
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          JAR=$(ls build/libs/claude-companion-*.jar | grep -v sources | head -1)
          xvfb-run -a -s "-screen 0 1280x720x24" python ci/smoketest.py --label ${{ matrix.label }} --mods ${{ matrix.mods }} --jar "$JAR"
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.label }}
          path: |
            game-*.log
            mc/run-*/logs/
            mc/run-*/crash-reports/
            mc/run-*/config/claudecompanion/*/server.log
